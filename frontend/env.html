<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赚钱环境 · 量化选股器</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="env.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <a class="btn btn-ghost btn-sm" href="index.html" type="button">
          <i data-lucide="arrow-left" aria-hidden="true"></i><span>返回</span>
        </a>
        <span class="brand-mark"><i data-lucide="compass" aria-hidden="true"></i></span>
        <div class="brand-text">
          <h1>赚钱环境</h1>
          <p id="envStatus">—</p>
        </div>
      </div>
      <div class="topbar-tools">
        <button id="btnPrevDay" class="btn btn-ghost" type="button" data-tooltip="前一天"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
        <span id="envDate" class="panel-meta">—</span>
        <button id="btnNextDay" class="btn btn-ghost" type="button" data-tooltip="后一天"><i data-lucide="chevron-right" aria-hidden="true"></i></button>
        <button id="btnCalc" class="btn btn-primary" type="button" data-tooltip="用当日收盘数据重新计算环境"><i data-lucide="refresh-cw" aria-hidden="true"></i><span>收盘计算</span></button>
        <a class="btn" href="review.html" data-tooltip="情绪周期复盘"><i data-lucide="clipboard-list" aria-hidden="true"></i><span>复盘</span></a>
        <a class="btn" href="tactics.html" data-tooltip="二板战法扫描"><i data-lucide="target" aria-hidden="true"></i><span>战法</span></a>
      </div>
    </header>

    <main class="main env-main">
      <div id="envBanner" class="env-banner" hidden></div>

      <section class="env-cards" id="envCards"></section>

      <section class="panel env-panel">
        <div class="panel-head"><h2>信号明细 · 短线/连板</h2></div>
        <div class="env-kv" id="sigShort"></div>
      </section>

      <section class="panel env-panel">
        <div class="panel-head"><h2>信号明细 · 大盘/量能</h2></div>
        <div class="env-kv" id="sigMarket"></div>
      </section>

      <section class="panel env-panel">
        <div class="panel-head"><h2>信号明细 · 板块/抱团</h2></div>
        <div class="env-kv" id="sigSector"></div>
      </section>

      <section class="panel env-panel">
        <div class="panel-head"><h2>近 12 日环境演变</h2><span class="panel-meta">四类分数曲线</span></div>
        <div id="envHistory" class="env-history"></div>
      </section>

      <section class="panel env-panel">
        <div class="panel-head"><h2>人工覆盖</h2><span class="panel-meta">环境是半主观判断，可手动修正</span></div>
        <div class="env-manual">
          <div class="env-radio" id="manualChoices"></div>
          <textarea id="manualNote" class="field" rows="2" placeholder="备注（可选）"></textarea>
          <div class="env-manual-actions">
            <button id="btnSaveManual" class="btn btn-primary" type="button"><i data-lucide="save" aria-hidden="true"></i><span>保存判定</span></button>
            <button id="btnClearManual" class="btn btn-ghost" type="button"><span>清除覆盖</span></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
