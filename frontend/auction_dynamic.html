<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>竞价窗口 · 量化选股器</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Microsoft YaHei",-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;padding:18px;margin:0}
  h1{font-size:19px;color:#e6edf3;border-left:4px solid #d29922;padding-left:12px;margin:0 0 6px}
  .meta{color:#8b949e;font-size:12px;margin-bottom:12px;line-height:1.7}
  .meta b{color:#e6edf3}

  /* 工具栏 */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:#161b22;padding:10px 14px;border-radius:7px;margin-bottom:12px;font-size:12px}
  .toolbar button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:5px;
    padding:5px 11px;font-size:12px;cursor:pointer;transition:.15s}
  .toolbar button:hover{background:#30363d;border-color:#8b949e}
  .toolbar button.act{background:#1f6feb;border-color:#1f6feb;color:#fff}
  .toolbar button:disabled{opacity:.4;cursor:not-allowed}
  .toolbar select{background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:5px;
    padding:5px 9px;font-size:12px;cursor:pointer}
  .hint{color:#6e7681;font-size:11.5px;margin-left:auto}

  /* 列配置面板 */
  .panel{display:none;background:#161b22;border:1px solid #30363d;border-radius:7px;
    padding:12px 14px;margin-bottom:12px}
  .panel.show{display:block}
  .panel h3{margin:0 0 10px;font-size:13px;color:#e6edf3;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:4px 11px;border-radius:14px;background:#21262d;border:1px solid #30363d;
    cursor:pointer;font-size:11.5px;user-select:none;transition:.15s}
  .chip:hover{border-color:#8b949e}
  .chip.on{background:#1f6feb22;border-color:#1f6feb;color:#79c0ff}
  .chip.no-src{opacity:.55}

  /* 表格 */
  .wrap{overflow-x:auto;border-radius:7px;border:1px solid #30363d}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th{background:#161b22;color:#9aa4af;font-weight:600;padding:7px 7px;text-align:right;
     border-bottom:2px solid #30363d;white-space:nowrap;font-size:12px;position:relative;user-select:none}
  th.drag{cursor:grab}
  th.drag:active{cursor:grabbing}
  th.over{background:#1f6feb33;border-left:3px solid #1f6feb}
  th .grip{color:#484f58;margin-right:3px;font-size:10px}
  th .sortic{color:#484f58;margin-left:2px;font-size:9px}
  th.sorted .sortic{color:#58a6ff}
  th.l,td.l{text-align:left}
  td{padding:6px 7px;text-align:right;border-bottom:1px solid #21262d;
     font-variant-numeric:tabular-nums;white-space:nowrap}
  tr:hover{background:#1c2128}
  .up{color:#ff4d4f;font-weight:600}
  .down{color:#00b96b;font-weight:600}
  .flat,.neu{color:#8b949e}
  .lu{color:#ff7875}
  .ld{color:#52c41a;font-weight:700}
  .strong{background:rgba(255,77,79,.09)}
  .weak{background:rgba(0,185,107,.07)}
  .dim{color:#6e7681;font-size:11.5px}
  /* 竞价涨停徽章：金额封单比这类指标只对涨停股成立，得让 人一眼看出谁算 */
  .lu-badge{display:inline-block;margin-left:4px;padding:0 3px;border-radius:3px;background:#c62828;color:#fff;font-size:10px;font-weight:600;line-height:14px;vertical-align:1px}
  .chain{color:#d29922;font-weight:700}
  .legend{margin:12px 0;font-size:12px;color:#8b949e;padding:10px 14px;background:#161b22;border-radius:6px;line-height:1.9}
  .legend span{margin-right:16px}
  .foot{margin-top:12px;font-size:12px;color:#8b949e;line-height:2;padding:12px 14px;background:#161b22;border-radius:6px}
  .msg{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:12.5px;line-height:1.8}
  .msg-warn{background:#d2992222;border:1px solid #d29922;color:#e3b341}
  .msg-err{background:#f8514922;border:1px solid #f85149;color:#ff7b72}
  .msg-ok{background:#3fb95022;border:1px solid #3fb950;color:#56d364}
  .msg code{background:#0d1117;padding:1px 5px;border-radius:3px;font-size:11.5px}
</style>
</head>
<body>

<h1>竞价窗口</h1>
<div class="meta">
  数据源 <b>后端 API</b> <code>/api/auction_top/dynamic</code> ｜
  日期 <b id="mDate">—</b> ｜ 抓取 <b id="mFetch">—</b> ｜ 条数 <b id="mCount">—</b> ｜
  数据窗口 <b id="mWin">—</b> ｜ 耗时 <b id="mCost">—</b>
</div>

<div id="banner"></div>

<div class="toolbar">
  <button id="btnPrev" title="前一天">◀</button>
  <select id="selDate"></select>
  <button id="btnNext" title="后一天">▶</button>
  <span style="color:#30363d;margin:0 4px">|</span>
  <button id="btnReload">↻ 刷新数据</button>
  <button id="btnForce">⚡ 强制重抓</button>
  <span style="color:#30363d;margin:0 4px">|</span>
  <button id="btnCols">⚙ 列配置</button>
  <button id="btnReset">↺ 恢复默认</button>
  <button id="btnPresetA">预设：打板视角</button>
  <button id="btnPresetB">预设：题材视角</button>
  <span class="hint">拖动表头调顺序 ｜ 点表头排序 ｜ 配置存浏览器</span>
</div>

<div class="panel" id="panel">
  <h3>勾选显示 / 隐藏列（顺序在表格中拖动表头调整）<span class="dim" style="font-weight:400"> ｜ 灰色 = 当前数据源不提供，恒显示「—」</span></h3>
  <div class="chips" id="chips"></div>
</div>

<div class="wrap">
  <table>
    <thead><tr id="thead"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="legend">
  <span style="color:#ff4d4f">■ 涨</span>
  <span style="color:#00b96b">■ 跌</span>
  <span style="color:#ff7875">● 尾秒抢筹</span>
  <span style="color:#52c41a">○ 尾秒撤退</span>
  <span style="color:#6e7681">— 无数据</span>
  <span style="color:#d29922">3板</span> = 昨连板数
</div>

<div class="foot" id="foot"></div>

<script>
'use strict';

/* ==================================================================
   配置区
   ================================================================== */
const API_BASE = '';                       // 与后端同源，留空即可
const KEY = 'auction_dyn_cols_v1';         // 独立 localStorage key，不与静态页冲突
const DAY_CACHE = 'auction_dyn_days_v1';   // 已知日期缓存

/* ==================================================================
   列定义 —— 与静态版保持一致；src:false 表示后端当前数据源不提供
   ================================================================== */
const COLS = {
  idx:   {label:'#',              w:36,  align:'left',  render:(r,i)=>`<span class="dim">${i+1}</span>`},
  name:  {label:'名称',           w:112, align:'left',  render:r=>{
    const nm = `<span style="font-weight:600" class="${(r.chg||0)>=9.5?'up':''}">${esc(r.name)}</span>`;
    return r.isLimitUp ? nm + '<span class="lu-badge">停</span>' : nm;
  }},
  code:  {label:'代码',           w:66,  align:'left',  render:r=>`<span class="dim">${esc(r.code)}</span>`},
  openPx:{label:'竞价开盘价',     w:90,  render:r=>r.openPx>0?`<span class="${cls(r.chg)}" style="font-weight:600">${r.openPx.toFixed(2)}</span>`:'<span class="neu">—</span>'},
  ps:    {label:'几天几板',       w:96,  render:r=>{
    if(!r.ps || r.ps<=0) return '<span class="neu">—</span>';
    return `<span class="chain">${r.ps}板</span> <span class="dim">${esc(r.plt||'涨停')}</span>`;
  }},
  plt:   {label:'昨日板型',       w:76,  align:'left', render:r=>r.plt?`<span class="dim">${esc(r.plt)}</span>`:'<span class="neu">—</span>'},
  seal:  {label:'封单额',         w:86,  render:r=>{
    if(!(r.seal>0)) return '<span class="neu">—</span>';
    // 只有竞价封住涨停，这笔买盘才算「封单」
    if(r.isLimitUp) return `<b>${yi(r.seal)}</b>`;
    // 悟道源的 seal 本身就是“涨停价上的买盘额”，未封板时根本不是封单 → 不显示
    if(r.sealIsLimitBid) return '<span class="neu" title="竞价未涨停，没有封单">—</span>';
    // 本地抓取源是原始买一挂单额，对非涨停股也有意义 → 灰显
    return `<span class="dim" title="竞价未涨停：这是买一最大挂单额，不是封单">${yi(r.seal)}</span>`;
  }},
  amtSealRatio:{label:'金额封单比', w:100, render:r=>{
    // 封单额 = 涨停价上的买盘。竞价没封住涨停就没有“封单”，比值无意义，
    // 不能拿它去和涨停股比大小。
    if(!r.isLimitUp) return '<span class="neu" title="竞价未涨停，无封单，比值不适用">未涨停</span>';
    if(!(r.seal>0) || !(r.amt>0)) return '<span class="neu">—</span>';
    const pct = r.amt / r.seal * 100;
    const lv = pct<10?['up','🟢 安全']:(pct<30?['','🟡 警惕']:['down','🔴 高危']);
    return `<span class="${lv[0]}">${pct.toFixed(1)}%</span> <span class="dim" style="font-size:11px">${lv[1]}</span>`;
  }},
  amtLbuyRatio:{label:'金额委买比', w:100, render:r=>{
    if(!r.isLimitUp) return '<span class="neu" title="竞价未涨停，无封单，比值不适用">未涨停</span>';
    if(!(r.lbuy>0) || !(r.amt>0)) return '<span class="neu">—</span>';
    const pct = r.amt / r.lbuy * 100;
    const lv = pct<10?['up','🟢 安全']:(pct<30?['','🟡 警惕']:['down','🔴 高危']);
    return `<span class="${lv[0]}">${pct.toFixed(1)}%</span> <span class="dim" style="font-size:11px">${lv[1]}</span>`;
  }},
  lbuy:  {label:'涨停委买额(09:25)', w:118, render:r=>{
    if(r.lbuyStale) return '<span class="neu" title="非竞价窗口且无 auction_seal 存档">—</span>';
    return r.lbuy>0?`<b>${yi(r.lbuy)}</b>`:'<span class="neu">—</span>';
  }},
  sealKeep:{label:'封单留存率', w:92, render:r=>{
    if(!r.isLimitUp) return '<span class="neu" title="竞价未涨停，无封单，比值不适用">未涨停</span>';
    if(!(r.lbuy>0) || !(r.seal>0)) return '<span class="neu">—</span>';
    const pct = r.seal / r.lbuy * 100;
    const col = pct>=90?'up':(pct>=30?'':'down');
    return `<span class="${col}">${pct.toFixed(1)}%</span>`;
  }},
  lbuy0915:{label:'委买额(09:20前)', w:120, render:r=>r.lbuy0915>0?yi(r.lbuy0915):'<span class="neu">—</span>'},
  lbuy0920:{label:'委买额(09:20后)', w:120, render:r=>r.lbuy0920t>0?yi(r.lbuy0920t):'<span class="neu">—</span>'},
  lbuyDiff1520:{label:'委买变化 09:20前→后', w:140, render:r=>{
    if(!(r.lbuy0915>0) || !(r.lbuy0920t>0)) return '<span class="neu">—</span>';
    const d = r.lbuy0920t - r.lbuy0915, pct = d / r.lbuy0915 * 100;
    return `<span class="${cls(d)}">${d>0?'+':''}${yi(d)}</span> <span class="dim" style="font-size:11px">${pct>0?'+':''}${pct.toFixed(0)}%</span>`;
  }},
  lbuyDiff2025:{label:'委买变化 09:20后→09:25', w:148, render:r=>{
    if(!(r.lbuy0920t>0) || !(r.lbuy0925>0)) return '<span class="neu">—</span>';
    const d = r.lbuy0925 - r.lbuy0920t, pct = d / r.lbuy0920t * 100;
    return `<span class="${cls(d)}">${d>0?'+':''}${yi(d)}</span> <span class="dim" style="font-size:11px">${pct>0?'+':''}${pct.toFixed(0)}%</span>`;
  }},
  chg:   {label:'竞价涨幅',       w:80,  render:r=>r.chg==null?'<span class="neu">—</span>':`<span class="${cls(r.chg)}">${sgn(r.chg)}</span>`},
  amt:   {label:'竞价金额',       w:82,  render:r=>r.amt>0?yi(r.amt):'<span class="neu">—</span>'},
  tr:    {label:'竞价换手%',      w:80,  render:r=>r.tr==null?'<span class="neu">—</span>':r.tr.toFixed(2)},
  trf:   {label:'自由流通换手%',  w:100, render:r=>r.trf==null?'<span class="neu">—</span>':r.trf.toFixed(2)},
  fmcap: {label:'自由流通市值',   w:96,  render:r=>r.fmcap>0?yi(r.fmcap):'<span class="neu">—</span>'},
  mcap:  {label:'流通市值',       w:82,  render:r=>r.mcap>0?yi(r.mcap):'<span class="neu">—</span>'},
  obp:   {label:'尾秒%',          w:70,  render:r=>{
    if(r.obp==null) return '<span class="neu">—</span>';
    return r.obs==='neutral'?'<span class="neu">—</span>':`<span class="${cls(r.obp)}">${sgn(r.obp)}</span>`;
  }},
  obs:   {label:'尾秒信号',       w:86,  render:r=>{
    if(r.obs==='late_bid_up') return '<span class="lu">● 抢筹</span>';
    if(r.obs==='late_bid_down') return '<span class="ld">○ 撤退</span>';
    return '<span class="neu">—</span>';
  }},
  vr:    {label:'竞价量比',       w:74,  render:r=>r.vr>0?r.vr.toFixed(2)+'x':'<span class="neu">—</span>'},
  bs:    {label:'竞价强度‱',      w:78,  render:r=>r.bs>0?r.bs.toFixed(0):'<span class="neu">—</span>'},
  avgPx: {label:'竞价均价',       w:84,  src:false, render:r=>r.avgPx>0?r.avgPx.toFixed(2):'<span class="neu">—</span>'},
  themes:{label:'题材',           w:170, align:'left', render:r=>{
    const t = (r.themes||[]).filter(Boolean).slice(0,3).join(' / ');
    return t?`<span class="dim">${esc(t)}</span>`:'<span class="neu">—</span>';
  }},
};

const DEFAULTS = ['idx','name','openPx','ps','seal','amtSealRatio','chg','amt','tr','fmcap','mcap','obp','vr','bs','themes'];
const DEFAULT_HIDDEN = ['code','obs','trf','plt','sealKeep','amtLbuyRatio','lbuy0915','lbuy0920','lbuy0920t','lbuyDiff1520','lbuyDiff2025','lbuy','avgPx'];

const PRESETS = {
  A: ['idx','name','chg','obp','obs','lbuy','seal','amtSealRatio','sealKeep','lbuyDiff1520','lbuyDiff2025','ps','plt','bs','vr','themes'],
  B: ['idx','name','seal','amtSealRatio','amtLbuyRatio','lbuy','sealKeep','lbuy0915','lbuyDiff1520','lbuy0920','lbuyDiff2025','chg','themes','amt','bs','ps','vr','trf','fmcap','openPx','obs','obp'],
};

/* ==================================================================
   工具函数
   ================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const yi  = v => (Number(v)/1e8).toFixed(2)+'亿';
const cls = v => v>0?'up':(v<0?'down':'flat');
const sgn = v => (v>0?'+':'')+Number(v).toFixed(2)+'%';
const num = v => (v==null || !isFinite(v)) ? null : Number(v);

/* 后端记录 → 页面字段 */
function mapRow(r){
  const prevClose = num(r.prevClose);
  const chg = num(r.changePct);
  const amt = num(r.auctionAmount) || 0;
  const tr  = num(r.turnover);
  const mcap = num(r.floatCap) || 0;
  return {
    // 原始
    code: r.code, name: r.name, industry: r.industry,
    price: num(r.price), prevClose: prevClose,
    auctionVolume: num(r.auctionVolume),
    // 映射
    chg: chg,
    amt: amt,
    seal: num(r.sealAmount) || 0,
    vr: num(r.volumeRatio) || 0,
    tr: tr,
    mcap: mcap,
    // 后端增强
    openPx: num(r.openPx),
    limitPct: num(r.limitPct),
    limitUpPrice: num(r.limitUpPrice),
    bs: num(r.bs) || 0,
    fmcap: num(r.fmcap) || 0,
    lbuy: num(r.lbuy) || 0,
    lbuyStale: !!r.lbuyStale,
    lbuySource: r.lbuySource,
    isLimitUp: !!r.isLimitUp,          // 竞价是否封住涨停（后端算：openPx vs limitUpPrice）
    sealIsLimitBid: !!r.sealIsLimitBid, // 封单额是否只是“涨停价挂单”而非真封单
    // 三时点涨停委买额（悟道 09:20前/后/09:25 或 auction_seal 存档 09:15/09:20/09:25）
    seal0915: num(r.seal0915) || 0,
    seal0920: num(r.seal0920) || 0,
    seal0925: num(r.seal0925) || 0,
    lbuy0915: num(r.lbuy0915) || 0,
    lbuy0920t: num(r.lbuy0920t) || 0,
    lbuy0925: num(r.lbuy0925),
    // 悟道独有字段（本地抓取拿不到）
    ps: (r.ps==null?null:num(r.ps)),
    plt: r.plt || null,
    obp: (r.obp==null?null:num(r.obp)),
    obs: r.obs || null,
    trf: (r.trf==null?null:num(r.trf)),
    avgPx: (r.avgPx==null?null:num(r.avgPx)),
    themes: Array.isArray(r.themes) ? r.themes : (r.industry && r.industry!=='其他' ? [r.industry] : []),
  };
}

/* ==================================================================
   状态
   ================================================================== */
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.order) && s.order.length) return s;
  }catch(e){}
  return {order:[...DEFAULTS], hidden:[...DEFAULT_HIDDEN], sortKey:'amt', sortAsc:false, date:''};
}
let state = loadState();
if(!state.date){ try{ state.date = localStorage.getItem(DAY_CACHE) || ''; }catch(e){} }
function saveState(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const NUMSORT = {
  amt:r=>r.amt, chg:r=>r.chg, obp:r=>r.obp, vr:r=>r.vr, tr:r=>r.tr,
  trf:r=>r.trf, bs:r=>r.bs, mcap:r=>r.mcap, fmcap:r=>r.fmcap,
  seal:r=>r.seal, lbuy:r=>r.lbuy, ps:r=>r.ps, openPx:r=>r.openPx,
  amtSealRatio:r=>(r.seal>0?r.amt/r.seal:null),
  amtLbuyRatio:r=>(r.lbuy>0?r.amt/r.lbuy:null),
  sealKeep:r=>(r.lbuy>0?r.seal/r.lbuy:null),
  idx:null,
};

let DATA = [];
let DATES = [];

/* ==================================================================
   渲染
   ================================================================== */
function visibleCols(){ return state.order.filter(k => !state.hidden.includes(k) && COLS[k]); }

function renderHead(){
  const th = $('thead');
  th.innerHTML = '';
  visibleCols().forEach(k => {
    const c = COLS[k];
    const t = document.createElement('th');
    t.className = 'drag ' + (c.align==='left'?'l ':'') + (state.sortKey===k?'sorted':'');
    t.dataset.key = k;
    t.style.width = c.w+'px';
    t.draggable = true;
    t.innerHTML = `<span class="grip">⠿</span>${esc(c.label)}<span class="sortic">${state.sortKey===k ? (state.sortAsc?'▲':'▼') : '⇅'}</span>`;
    th.appendChild(t);
  });
  bindDrag();
}

function renderBody(){
  const tb = $('tbody');
  const rows = DATA.slice();
  const sk = state.sortKey;
  const f = NUMSORT[sk];
  if(sk && typeof f === 'function'){
    rows.sort((a,b)=>{
      const va = f(a), vb = f(b);
      if(va==null && vb==null) return 0;
      if(va==null) return 1;
      if(vb==null) return -1;
      return state.sortAsc ? va-vb : vb-va;
    });
  } else if(sk === 'themes'){
    rows.sort((a,b)=> state.sortAsc
      ? (a.themes||[]).join('').localeCompare((b.themes||[]).join(''))
      : (b.themes||[]).join('').localeCompare((a.themes||[]).join('')));
  } else if(sk === 'name' || sk === 'plt'){
    rows.sort((a,b)=> state.sortAsc
      ? String(a[sk]||'').localeCompare(String(b[sk]||''))
      : String(b[sk]||'').localeCompare(String(a[sk]||'')));
  }
  const cols = visibleCols();
  if(!rows.length){
    tb.innerHTML = `<tr><td colspan="${cols.length}" style="text-align:center;padding:30px;color:#6e7681">暂无数据</td></tr>`;
    return;
  }
  tb.innerHTML = rows.map((r,i)=>{
    const rowCls = (r.chg||0)>=9.5 ? 'strong' : ((r.chg||0)<=-3 ? 'weak' : '');
    return `<tr class="${rowCls}">` + cols.map(k=>{
      const c = COLS[k];
      return `<td class="${c.align==='left'?'l':''}">${c.render(r,i)}</td>`;
    }).join('') + '</tr>';
  }).join('');
}

function renderChips(){
  const box = $('chips');
  box.innerHTML = '';
  Object.keys(COLS).forEach(k=>{
    const on = !state.hidden.includes(k);
    const el = document.createElement('div');
    const noSrc = COLS[k].src === false;
    el.className = 'chip' + (on?' on':'') + (noSrc?' no-src':'');
    el.textContent = (on?'✓ ':'　') + COLS[k].label + (noSrc?' (无源)':'');
    el.onclick = ()=>{
      if(on) state.hidden.push(k);
      else state.hidden = state.hidden.filter(x=>x!==k);
      saveState(); renderChips(); renderHead(); renderBody();
    };
    box.appendChild(el);
  });
}

/* ==================================================================
   拖动排序
   ================================================================== */
let dragKey = null;
function bindDrag(){
  const ths = [...document.querySelectorAll('#thead th')];
  ths.forEach(t=>{
    t.addEventListener('dragstart', e=>{
      dragKey = t.dataset.key;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragKey);
      t.style.opacity = '.4';
    });
    t.addEventListener('dragend', ()=>{ t.style.opacity=''; ths.forEach(x=>x.classList.remove('over')); });
    t.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; t.classList.add('over'); });
    t.addEventListener('dragleave', ()=> t.classList.remove('over'));
    t.addEventListener('drop', e=>{
      e.preventDefault();
      t.classList.remove('over');
      const target = t.dataset.key;
      if(!dragKey || dragKey===target) return;
      const ord = state.order.slice();
      ord.splice(ord.indexOf(dragKey),1);
      ord.splice(ord.indexOf(target),0,dragKey);
      state.order = ord;
      saveState(); renderHead(); renderBody();
      dragKey = null;
    });
    t.addEventListener('click', ()=>{
      const k = t.dataset.key;
      if(state.sortKey === k) state.sortAsc = !state.sortAsc;
      else { state.sortKey = k; state.sortAsc = false; }
      saveState(); renderHead(); renderBody();
    });
  });
}

/* ==================================================================
   数据加载
   ================================================================== */
function banner(kind, html){
  $('banner').innerHTML = html ? `<div class="msg msg-${kind}">${html}</div>` : '';
}

async function fetchDates(){
  try{
    const r = await fetch(API_BASE + '/api/auction_top/dates', {cache:'no-store'});
    const d = await r.json();
    DATES = (d && d.dates || []).map(x => x.date);
  }catch(e){ DATES = []; }
  return DATES;
}

async function fetchRows(date, force){
  const t0 = performance.now();
  const url = API_BASE + '/api/auction_top/dynamic?date=' + encodeURIComponent(date) + (force?'&force=1':'');
  const r = await fetch(url, {cache:'no-store'});
  const d = await r.json();
  const cost = Math.round(performance.now() - t0);
  if(!d || !d.ok) throw new Error((d && d.error) || '加载失败');
  return {d, cost};
}

async function loadDate(date, force){
  if(!date) return;
  banner('', '');
  $('tbody').innerHTML = '<tr><td style="text-align:center;padding:24px;color:#8b949e">加载中…</td></tr>';
  try{
    const {d, cost} = await fetchRows(date, force);
    DATA = (d.rows || []).map(mapRow);
    state.date = date; saveState();
    try{ localStorage.setItem(DAY_CACHE, date); }catch(e){}

    $('mDate').textContent = d.date || date;
    $('mFetch').textContent = (DATA[0] && DATA[0].fetchedAt) || (d.rows[0] && d.rows[0].fetchedAt) || '—';
    $('mCount').textContent = DATA.length + ' 只';
    $('mWin').textContent = d.inWindow ? '✅ 09:25–09:30 内' : '⏸ 窗口外';
    $('mCost').textContent = cost + ' ms' + (d.cached ? '（缓存）' : '');
    $('selDate').value = date;

    const warns = [];
    if(d.fallback) warns.push('MySQL 不可用，已从 JSON 归档读取');
    if(d.enrichError) warns.push('增强失败：<code>' + esc(d.enrichError) + '</code>');
    if(!d.inWindow) warns.push('当前不在竞价窗口（09:25–09:30），<b>涨停委买额</b>无法取 09:25 快照，相关列显示「—」');
    if(warns.length) banner(d.enrichError?'err':'warn', warns.join('　｜　'));
    else banner('ok', '数据正常');

    renderFoot();
    renderChips(); renderHead(); renderBody();
  }catch(e){
    DATA = [];
    banner('err', '加载失败：<code>' + esc(e.message||e) + '</code>' +
      '<br>请确认后端已启动，且该日期存在归档（<code>data/auction_top/&lt;date&gt;.json</code>）。');
    $('tbody').innerHTML = '';
    renderHead(); renderBody();
  }
}

function renderFoot(){
  const n = DATA.length;
  const sealed = DATA.filter(r=>r.seal>0 && r.amt>0 && r.amt/r.seal*100 > 30).length;
  const up = DATA.filter(r=>(r.chg||0)>=9.5).length;
  const down = DATA.filter(r=>(r.chg||0)<=-3).length;
  const amtSum = DATA.reduce((s,r)=>s+(r.amt||0),0);
  $('foot').innerHTML =
    `<div style="margin-bottom:8px;color:#e6edf3;font-weight:700">当日汇总</div>` +
    `共 <b style="color:#e6edf3">${n}</b> 只 ｜ 竞价总额 <b style="color:#e6edf3">${yi(amtSum)}</b> ｜ ` +
    `竞价涨幅 ≥9.5%：<b class="up">${up}</b> 只 ｜ 涨幅 ≤-3%：<b class="down">${down}</b> 只 ｜ ` +
    `金额封单比 &gt;30%（高危）：<b class="down">${sealed}</b> 只`;
}

/* ==================================================================
   事件
   ================================================================== */
$('btnCols').onclick = function(){
  const p = $('panel');
  p.classList.toggle('show');
  this.classList.toggle('act', p.classList.contains('show'));
};
$('btnReset').onclick = ()=>{
  state = {order:[...DEFAULTS], hidden:[...DEFAULT_HIDDEN], sortKey:'amt', sortAsc:false, date:state.date};
  saveState(); renderChips(); renderHead(); renderBody();
};
$('btnPresetA').onclick = ()=>applyPreset('A');
$('btnPresetB').onclick = ()=>applyPreset('B');
function applyPreset(name){
  const list = PRESETS[name];
  const all = Object.keys(COLS);
  state.order = [...list, ...all.filter(k=>!list.includes(k))];
  state.hidden = all.filter(k=>!list.includes(k));
  saveState(); renderChips(); renderHead(); renderBody();
}
$('btnReload').onclick = ()=> loadDate($('selDate').value || state.date, false);
$('btnForce').onclick  = ()=> loadDate($('selDate').value || state.date, true);
$('selDate').onchange  = ()=> loadDate($('selDate').value, false);
$('btnPrev').onclick = ()=>{
  const i = DATES.indexOf($('selDate').value);
  if(i>=0 && i<DATES.length-1) loadDate(DATES[i+1], false);
};
$('btnNext').onclick = ()=>{
  const i = DATES.indexOf($('selDate').value);
  if(i>0) loadDate(DATES[i-1], false);
};

function fillDateSelect(){
  const sel = $('selDate');
  sel.innerHTML = DATES.length
    ? DATES.map(d=>`<option value="${d}">${d}</option>`).join('')
    : '<option value="">（无归档日期）</option>';
  if(state.date && DATES.includes(state.date)) sel.value = state.date;
  $('btnPrev').disabled = false;
  $('btnNext').disabled = false;
}

/* ==================================================================
   启动
   ================================================================== */
(async function boot(){
  renderChips(); renderHead(); renderBody();
  await fetchDates();
  fillDateSelect();
  if(DATES.length){
    // 复盘页默认落在最新交易日（DATES[0]）。只有当用户主动选了更早的日期
    // 且该日期仍是最新时，才沿用——否则新的一天数据出来了还停在旧日期上。
    const target = (state.date && DATES.includes(state.date) && state.date === DATES[0])
      ? state.date : DATES[0];
    loadDate(target, false);
  }else{
    banner('warn',
      '后端暂无任何竞价榜归档。<br>' +
      '· 交易日 09:25–09:30 自动任务会抓取并落盘<br>' +
      '· 也可点「⚡ 强制重抓」手动触发（非竞价窗口只预览、不保存）<br>' +
      '· 归档路径：<code>data/auction_top/&lt;YYYY-MM-DD&gt;.json</code>');
    renderFoot();
  }
})();
</script>
