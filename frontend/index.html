<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>量化选股器</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><i data-lucide="candlestick-chart" aria-hidden="true"></i></span>
        <div class="brand-text">
          <h1>量化选股器</h1>
          <p id="marketPhase">—</p>
        </div>
      </div>
      <div class="topbar-tools">
        <span id="sourceBadge" class="source-badge">未加载</span>
        <span id="autoBadge" class="auto-badge"><i data-lucide="calendar-clock" aria-hidden="true"></i><span>9:25 自动抓取</span></span>
        <button id="btnFetch" class="btn btn-primary" type="button" data-tooltip="9:25 后抓取竞价金额前 200（腾讯优先，东财兜底）">
          <i data-lucide="radar" aria-hidden="true"></i><span>抓取竞价数据</span>
        </button>
        <button id="btnRefreshDemo" class="btn" type="button" data-tooltip="无行情时生成一批演示数据">
          <i data-lucide="flask-conical" aria-hidden="true"></i><span>演示数据</span>
        </button>

        <button id="btnImport" class="btn" type="button" data-tooltip="支持 UTF-8 或 GBK 编码的 CSV">
          <i data-lucide="upload" aria-hidden="true"></i><span>导入 CSV</span>
        </button>
        <button id="btnTemplate" class="btn btn-ghost" type="button">
          <i data-lucide="file-down" aria-hidden="true"></i><span>模板</span>
        </button>
        <button id="btnExport" class="btn btn-ghost" type="button" data-tooltip="导出当前结果">
          <i data-lucide="download" aria-hidden="true"></i><span>导出结果</span>
        </button>
        <a class="btn" href="history.html" data-tooltip="查看 MySQL 历史竞价数据">
          <i data-lucide="history" aria-hidden="true"></i><span>历史</span>
        </a>
        <a class="btn" href="plan.html" data-tooltip="每日早盘预案">
          <i data-lucide="sunrise" aria-hidden="true"></i><span>预案</span>
        </a>
        <a class="btn" href="review.html" data-tooltip="每日情绪周期复盘">
          <i data-lucide="clipboard-list" aria-hidden="true"></i><span>复盘</span>
        </a>
        <input id="fileInput" type="file" accept=".csv,.txt" hidden>
      </div>
    </header>

    <div class="layout" id="layout">
      <aside class="sidebar">
        <section class="panel market-panel">
          <div class="panel-head">
            <h2>数据快照</h2>
            <span id="marketTime" class="panel-meta">—</span>
          </div>
          <div id="marketIndices" class="indices"></div>
          <div id="marketBreadth" class="breadth"></div>
        </section>

        <section class="panel filter-panel">
          <div class="panel-head">
            <h2>板块</h2>
          </div>
          <div class="sector-chips" id="sectorChips"></div>
        </section>

      </aside>

      <main class="main">
        <section class="stats" id="stats" aria-label="统计"></section>

        <section class="panel top-panel" id="topPanel">
          <div class="panel-head">
            <h2>今日竞价 Top10</h2>
            <span id="topMeta" class="panel-meta">—</span>
          </div>
          <div id="topList" class="top-list"></div>
        </section>

        <section class="panel table-panel">
          <div class="table-head">
            <div class="search-box">
              <i data-lucide="search" aria-hidden="true"></i>
              <input id="searchInput" type="search" placeholder="代码 / 名称 / 板块" aria-label="搜索股票">
            </div>
            <div class="table-actions">
              <label class="check-label">
                <input id="top60Only" type="checkbox" checked>
                <span>只看前60</span>
              </label>
              <label class="check-label">
                <input id="watchOnly" type="checkbox">
                <span>只看自选</span>
              </label>
              <span id="resultCount" class="muted">—</span>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table" id="stockTable">
              <thead>
                <tr>
                  <th class="th-star" aria-label="自选"></th>
                  <th class="sortable" data-key="code">代码</th>
                  <th class="sortable" data-key="name">名称 / 板块</th>
                  <th class="sortable" data-key="price">竞价价</th>
                  <th class="sortable" data-key="changePct">竞价涨幅</th>
                  <th class="sortable col-realtime" data-key="currentPct">当前涨幅</th>
                  <th class="sortable" data-key="auctionAmount">竞价金额</th>
                  <th class="sortable col-yamount" data-key="yesterdayAmount">昨日成交额</th>
                  <th class="sortable col-ratio" data-key="ratioToYesterday">竞价占比</th>
                  <th class="sortable col-strength" data-key="amountStrength">金额强度</th>
                  <th class="sortable col-auctionTurnover" data-key="auctionTurnover">竞价换手</th>
                  <th class="sortable col-market" data-key="floatCap">流通市值</th>
                  <th class="sortable" data-key="score">超预期分</th>
                  <th class="sortable" data-key="tags">状态</th>
                </tr>
              </thead>
              <tbody id="stockBody"></tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state" hidden>
            <i data-lucide="filter-x" aria-hidden="true"></i>
            <span>没有符合条件的股票</span>
          </div>
        </section>
      </main>

      <aside class="detail-panel" id="detailPanel" hidden aria-label="个股详情">
        <div id="detailContent"></div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
