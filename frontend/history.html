<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>历史竞价 · 量化选股器</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script defer src="history.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <button id="btnBack" class="btn btn-ghost btn-sm" type="button">
          <i data-lucide="arrow-left" aria-hidden="true"></i><span>返回</span>
        </button>
        <span class="brand-mark"><i data-lucide="database" aria-hidden="true"></i></span>
        <div class="brand-text">
          <h1>历史竞价</h1>
          <p id="historyStatus">—</p>
        </div>
      </div>
      <div class="topbar-tools">
        <button id="btnExport" class="btn btn-ghost" type="button" data-tooltip="导出选中日期的全部股票">
          <i data-lucide="download" aria-hidden="true"></i><span>导出当日 CSV</span>
        </button>
        <a class="btn" href="plan.html" data-tooltip="每日早盘预案">
          <i data-lucide="sunrise" aria-hidden="true"></i><span>预案</span>
        </a>
        <a class="btn" href="review.html" data-tooltip="每日情绪周期复盘">
          <i data-lucide="clipboard-list" aria-hidden="true"></i><span>复盘</span>
        </a>
      </div>
    </header>

    <div class="layout history-layout">
      <aside class="sidebar history-sidebar">
        <section class="panel">
          <div class="panel-head">
            <h2>历史日期</h2>
            <span id="dateCount" class="panel-meta">—</span>
          </div>
          <div id="dateList" class="date-list"></div>
          <div class="date-pager">
            <button id="btnPagePrev" class="btn btn-ghost btn-sm" type="button" disabled>
              <i data-lucide="chevron-left" aria-hidden="true"></i><span>上一页</span>
            </button>
            <span id="pageInfo" class="page-info">—</span>
            <button id="btnPageNext" class="btn btn-ghost btn-sm" type="button" disabled>
              <i data-lucide="chevron-right" aria-hidden="true"></i><span>下一页</span>
            </button>
          </div>
        </section>
      </aside>

      <main class="main">
        <section class="stats" id="dayStats"></section>

        <section class="panel table-panel">
          <div class="table-head">
            <span id="resultCount" class="muted">—</span>
          </div>
          <div class="table-responsive">
            <table class="table" id="stockTable">
              <thead>
                <tr>
                  <th>排名</th>
                  <th>代码</th>
                  <th>名称 / 板块</th>
                  <th>竞价价</th>
                  <th>竞价涨幅</th>
                  <th>收盘涨幅</th>
                  <th>竞价金额</th>
                  <th>昨日成交额</th>
                  <th>竞价占比</th>
                  <th>金额强度</th>
                  <th>竞价换手</th>
                  <th>流通市值</th>
                  <th>超预期分</th>
                  <th>状态</th>
                </tr>
              </thead>
              <tbody id="stockBody"></tbody>
            </table>
          </div>
          <div id="emptyState" class="empty-state" hidden>
            <i data-lucide="filter-x" aria-hidden="true"></i>
            <span>没有符合条件的数据</span>
          </div>
        </section>
      </main>

      <aside class="detail-panel" id="detailPanel" hidden aria-label="个股历史">
        <div id="detailContent"></div>
      </aside>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
